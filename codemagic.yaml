workflows:
  android-build:
    name: Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Build debug APK
        script: |
          cd CameraSecurityAndroid
          chmod +x ./gradlew
          ./gradlew assembleDebug
    artifacts:
      - CameraSecurityAndroid/app/build/outputs/apk/debug/*.apk
