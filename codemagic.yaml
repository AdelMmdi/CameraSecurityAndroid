workflows:
  android-build:
    name: Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Find Gradle wrapper and build APK
        script: |
          WRAPPER=$(find . -maxdepth 5 -type f -name gradlew | head -n 1)
          if [ -z "$WRAPPER" ]; then
            echo "Could not find gradlew. Add the Gradle Wrapper files to your repository."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$WRAPPER")
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew assembleDebug
    artifacts:
      - "**/build/outputs/apk/debug/*.apk"
